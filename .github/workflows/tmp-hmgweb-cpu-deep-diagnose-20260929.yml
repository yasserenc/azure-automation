name: Temporary hmgweb CPU deep diagnostics 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-hmgweb-cpu-deep-diagnose-20260929.yml'

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    name: Diagnose hmgweb - ${{ matrix.azure_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        azure_target: [rfcy, wdt, altaaf, oamal, alban, Ulfah]

    steps:
      - name: Login - rfcy
        if: ${{ matrix.azure_target == 'rfcy' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_rfcy }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_rfcy }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_rfcy }}

      - name: Login - wdt
        if: ${{ matrix.azure_target == 'wdt' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_wdt }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_wdt }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_wdt }}

      - name: Login - altaaf
        if: ${{ matrix.azure_target == 'altaaf' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_altaaf }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_altaaf }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_altaaf }}

      - name: Login - oamal
        if: ${{ matrix.azure_target == 'oamal' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_oamal }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_oamal }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_oamal }}

      - name: Login - alban
        if: ${{ matrix.azure_target == 'alban' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_alban }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_alban }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_alban }}

      - name: Login - Ulfah
        if: ${{ matrix.azure_target == 'Ulfah' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_Ulfah }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_Ulfah }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_Ulfah }}

      - name: Locate VM and run read-only diagnostics
        shell: bash
        env:
          AZURE_TARGET: ${{ matrix.azure_target }}
          TARGET_IP: 20.71.90.212
        run: |
          set -Eeuo pipefail
          az account get-access-token --query expiresOn -o tsv >/dev/null

          match_json="$(az network public-ip list --query "[?ipAddress=='${TARGET_IP}']" -o json)"
          count="$(jq 'length' <<<"$match_json")"
          if [[ "$count" == "0" ]]; then
            echo "MATCH=NO target=${AZURE_TARGET}"
            exit 0
          fi
          [[ "$count" == "1" ]]
          echo "MATCH=YES target=${AZURE_TARGET}"

          ipconfig_id="$(jq -r '.[0].ipConfiguration.id // empty' <<<"$match_json")"
          nic_name="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="networkinterfaces") {print $(i+1); exit}}' <<<"$ipconfig_id")"
          nic_rg="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="resourcegroups") {print $(i+1); exit}}' <<<"$ipconfig_id")"
          vm_id="$(az network nic show -g "$nic_rg" -n "$nic_name" --query 'virtualMachine.id' -o tsv)"
          vm_name="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="virtualmachines") {print $(i+1); exit}}' <<<"$vm_id")"
          vm_rg="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="resourcegroups") {print $(i+1); exit}}' <<<"$vm_id")"

          echo "VM=$vm_name"
          echo "VM_RG=$vm_rg"
          echo "VM_ID=$vm_id"
          az vm get-instance-view -g "$vm_rg" -n "$vm_name" --query "{power:instanceView.statuses[?starts_with(code,'PowerState/')].displayStatus|[0],size:hardwareProfile.vmSize}" -o jsonc

          echo '=== AZURE CPU METRIC: LAST 2 HOURS, 1-MINUTE ==='
          start="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          az monitor metrics list --resource "$vm_id" --metric "Percentage CPU" --interval PT1M --aggregation Average Maximum --start-time "$start" --end-time "$end" -o json             | jq -r '.value[0].timeseries[0].data[] | select(.average != null or .maximum != null) | "\(.timeStamp) avg=\(.average // 0) max=\(.maximum // 0)"'

          echo '=== AZURE NETWORK/DISK METRICS: LAST 30 MINUTES, 1-MINUTE ==='
          start30="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          az monitor metrics list --resource "$vm_id" --metric "Network In Total,Network Out Total,Disk Read Bytes,Disk Write Bytes" --interval PT1M --aggregation Total --start-time "$start30" --end-time "$end" -o json             | jq -r '.value[] | .name.value as $n | [.timeseries[].data[] | select(.total != null) | .total] as $v | "\($n) sum=\($v|add // 0) peak1m=\($v|max // 0)"'

          cat > guest_snapshot.sh <<'GUEST'
          set -u
          export LC_ALL=C
          echo '=== GUEST SNAPSHOT ==='
          date -Is
          hostname -f || hostname
          uptime
          printf 'nproc='; nproc
          cat /proc/loadavg
          free -h
          echo '--- vmstat ---'
          vmstat 1 5 || true
          echo '--- top cpu processes ---'
          ps -eo pid,ppid,user,stat,etimes,%cpu,%mem,comm,args --sort=-%cpu | head -n 30
          echo '--- docker stats ---'
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemPerc}} pids={{.PIDs}} block={{.BlockIO}} net={{.NetIO}}' 2>/dev/null | sort || true
          echo '--- docker states ---'
          for cid in $(docker ps -aq 2>/dev/null); do docker inspect -f '{{.Name}} restart={{.RestartCount}} status={{.State.Status}} oom={{.State.OOMKilled}} started={{.State.StartedAt}}' "$cid" 2>/dev/null; done
          echo '--- socket summary ---'
          ss -s || true
          echo '--- github runner services ---'
          systemctl --no-pager --type=service --all 2>/dev/null | grep -Ei 'actions.runner|github|runner' || true
          GUEST

          echo '=== AZURE RUN COMMAND: CURRENT GUEST SNAPSHOT ==='
          az vm run-command invoke -g "$vm_rg" -n "$vm_name" --command-id RunShellScript --scripts @guest_snapshot.sh -o json             | jq -r '.value[]?.message // empty'

          cat > guest_sample.sh <<'GUEST'
          set -u
          export LC_ALL=C
          echo '=== 40-SECOND CPU SAMPLE ==='
          for i in $(seq 1 8); do
            echo "--- sample=$i time=$(date -Is) ---"
            ps -eo pid,ppid,user,stat,%cpu,%mem,comm,args --sort=-%cpu | head -n 12
            docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemPerc}} pids={{.PIDs}}' 2>/dev/null | sort | head -n 30 || true
            sleep 5
          done
          GUEST

          echo '=== AZURE RUN COMMAND: CPU SAMPLING ==='
          az vm run-command invoke -g "$vm_rg" -n "$vm_name" --command-id RunShellScript --scripts @guest_sample.sh -o json             | jq -r '.value[]?.message // empty'

          cat > guest_context.sh <<'GUEST'
          set -u
          export LC_ALL=C
          echo '=== TIMERS ==='
          systemctl list-timers --all --no-pager 2>/dev/null | head -n 80 || true
          echo '=== ROOT CRONTAB ==='
          crontab -l 2>/dev/null || true
          echo '=== RECENT ERRORS ==='
          journalctl --since '90 minutes ago' -p err..alert --no-pager -n 120 2>/dev/null || true
          echo '=== OOM/THROTTLE ==='
          journalctl -b --no-pager 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process|soft lockup|hard lockup|watchdog|throttl' | tail -n 80 || true
          echo '=== NGINX PRESSURE COUNTS ==='
          if [ -d /www/wwwlogs ]; then
            tail -q -n 3000 /www/wwwlogs/*.log 2>/dev/null | awk 'NF>=9 {gsub(/\?.*/, "", $7); print $1, $7, $9}' > /tmp/ngdiag.$$ || true
            echo '-- top IP counts --'
            awk '{print $1}' /tmp/ngdiag.$$ 2>/dev/null | sort | uniq -c | sort -nr | head -n 12 || true
            echo '-- top URI counts --'
            awk '{print $2}' /tmp/ngdiag.$$ 2>/dev/null | sort | uniq -c | sort -nr | head -n 15 || true
            echo '-- status counts --'
            awk '{print $3}' /tmp/ngdiag.$$ 2>/dev/null | sort | uniq -c | sort -nr | head -n 10 || true
            rm -f /tmp/ngdiag.$$ || true
          fi
          echo '=== DOCKER ERROR-LIKE COUNTS LAST 30M ==='
          for n in $(docker ps --format '{{.Names}}' 2>/dev/null); do
            c=$(docker logs --since 30m "$n" 2>&1 | grep -Eic 'error|exception|traceback|fatal|panic|timeout|deadlock|too many|killed' || true)
            echo "$n errors=$c"
          done
          GUEST

          echo '=== AZURE RUN COMMAND: TRIGGERS / ERRORS / TRAFFIC ==='
          az vm run-command invoke -g "$vm_rg" -n "$vm_name" --command-id RunShellScript --scripts @guest_context.sh -o json             | jq -r '.value[]?.message // empty'

          echo 'DEEP_DIAGNOSTIC_COMPLETE=YES'
