name: Temporary add vm-storage Azure federation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-add-vm-storage-federation.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login - Ulfah branch federation
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_Ulfah }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_Ulfah }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_Ulfah }}

      - name: Add vm-storage federated credential if absent
        shell: bash
        env:
          APP_ID: ${{ secrets.AZURE_CLIENT_ID_Ulfah }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/federated.json" <<'JSON'
          {
            "name": "github-vm-storage",
            "issuer": "https://token.actions.githubusercontent.com",
            "subject": "repo:yasserenc@149335096/azure-automation@1350769428:environment:vm-storage",
            "description": "GitHub Actions vm-storage environment for azure-automation",
            "audiences": ["api://AzureADTokenExchange"]
          }
          JSON

          existing="$(az ad app federated-credential list --id "$APP_ID" --query "[?subject=='repo:yasserenc@149335096/azure-automation@1350769428:environment:vm-storage'].name | [0]" -o tsv)"
          if [[ -n "$existing" ]]; then
            echo "Federated credential already exists: $existing"
            exit 0
          fi

          az ad app federated-credential create             --id "$APP_ID"             --parameters "$RUNNER_TEMP/federated.json"             --query '{name:name,subject:subject,audiences:audiences}'             -o json
