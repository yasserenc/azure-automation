name: Temporary oamal traffic attribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-oamal-traffic-attribution.yml

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_oamal }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_oamal }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_oamal }}

      - name: Query bandwidth attribution
        shell: bash
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_oamal }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time, datetime
          sub=os.environ["SUBSCRIPTION_ID"]
          end=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          base={
            "type":"Usage",
            "timeframe":"Custom",
            "timePeriod":{"from":"2026-01-01T00:00:00Z","to":end},
            "dataset":{
              "granularity":"None",
              "aggregation":{
                "cost":{"name":"PreTaxCost","function":"Sum"},
                "qty":{"name":"UsageQuantity","function":"Sum"}
              },
              "filter":{"dimensions":{"name":"MeterCategory","operator":"In","values":["Bandwidth"]}}
            }
          }

          def run(grouping, label):
            body=json.loads(json.dumps(base))
            body["dataset"]["grouping"]=[{"type":"Dimension","name":x} for x in grouping]
            url=f"https://management.azure.com/subscriptions/{sub}/providers/Microsoft.CostManagement/query?api-version=2026-06-01"
            cmd=["az","rest","--method","post","--url",url,"--headers","Content-Type=application/json","--body",json.dumps(body),"-o","json"]
            raw=None
            for d in [0,5,10,20,30]:
              if d: time.sleep(d)
              try:
                raw=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT); break
              except subprocess.CalledProcessError as e:
                if ("429" in (e.output or "") or "Too Many Requests" in (e.output or "")):
                  continue
                print(e.output); raise
            if raw is None: raise RuntimeError("query failed after retries")
            data=json.loads(raw)
            cols=[c["name"] for c in data["properties"]["columns"]]
            rows=[dict(zip(cols,r)) for r in data["properties"]["rows"]]
            print(label+"="+json.dumps(rows,separators=(",",":")))

          run(["ResourceId","ResourceType","ResourceGroupName","ResourceLocation","Meter","Product","UnitOfMeasure"],"ATTRIBUTION")
          run(["BillingMonth","ResourceId","Meter","Product","UnitOfMeasure"],"MONTHLY")
          PY
