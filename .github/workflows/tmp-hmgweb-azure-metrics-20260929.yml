name: Temporary hmgweb Azure metric snapshot 20260929
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-hmgweb-azure-metrics-20260929.yml'
permissions:
  id-token: write
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_rfcy }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_rfcy }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_rfcy }}
      - shell: bash
        env:
          TARGET_IP: 20.71.90.212
        run: |
          set -Eeuo pipefail
          m="$(az network public-ip list --query "[?ipAddress=='${TARGET_IP}']" -o json)"
          [[ "$(jq length <<<"$m")" == "1" ]]
          ipconfig="$(jq -r '.[0].ipConfiguration.id' <<<"$m")"
          nic="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="networkinterfaces"){print $(i+1);exit}}' <<<"$ipconfig")"
          rg="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="resourcegroups"){print $(i+1);exit}}' <<<"$ipconfig")"
          vmid="$(az network nic show -g "$rg" -n "$nic" --query virtualMachine.id -o tsv)"
          vm="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="virtualmachines"){print $(i+1);exit}}' <<<"$vmid")"
          vmrg="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="resourcegroups"){print $(i+1);exit}}' <<<"$vmid")"
          echo "MATCH=YES"
          echo "VM=$vm"
          echo "VM_RG=$vmrg"
          az vm show -g "$vmrg" -n "$vm" -d --query "{name:name,size:hardwareProfile.vmSize,power:powerState,privateIps:privateIps,publicIps:publicIps}" -o jsonc
          start="$(date -u -d '45 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo '=== CPU 45M ==='
          az monitor metrics list --resource "$vmid" --metric "Percentage CPU" --interval PT1M --aggregation Average Maximum --start-time "$start" --end-time "$end" -o json | jq -r '.value[0].timeseries[0].data[] | select(.average != null) | "\(.timeStamp) avg=\(.average) max=\(.maximum)"'
          echo '=== CPU CREDITS 45M ==='
          az monitor metrics list --resource "$vmid" --metric "CPU Credits Remaining,CPU Credits Consumed" --interval PT1M --aggregation Average Minimum Maximum --start-time "$start" --end-time "$end" -o json | jq -r '.value[] | .name.value as $n | .timeseries[].data[] | select(.average != null or .minimum != null or .maximum != null) | "\($n) \(.timeStamp) avg=\(.average // 0) min=\(.minimum // 0) max=\(.maximum // 0)"'
          echo '=== NETWORK/DISK 15M ==='
          start15="$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          az monitor metrics list --resource "$vmid" --metric "Network In Total,Network Out Total,Disk Read Bytes,Disk Write Bytes" --interval PT1M --aggregation Total --start-time "$start15" --end-time "$end" -o json | jq -r '.value[] | .name.value as $n | [.timeseries[].data[] | select(.total != null) | .total] as $v | "\($n) sum=\($v|add // 0) peak1m=\($v|max // 0)"'
