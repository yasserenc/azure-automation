name: Temporary Ulfah ERPNext resize inventory

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure - Ulfah
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_Ulfah }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_Ulfah }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_Ulfah }}

      - name: Query exact B-series resize candidates and retail prices
        shell: bash
        run: |
          set -euo pipefail
          RG="ERPNXTVM_GROUP"
          VM="erpnxtvm"
          LOC="$(az vm show -g "$RG" -n "$VM" --query location -o tsv --only-show-errors)"
          CUR="$(az vm show -g "$RG" -n "$VM" --query hardwareProfile.vmSize -o tsv --only-show-errors)"
          az vm list-vm-resize-options -g "$RG" -n "$VM" --query '[].name' -o tsv --only-show-errors | sort -u > /tmp/resize.txt
          az vm list-skus --location "$LOC" --resource-type virtualMachines --all -o json --only-show-errors > /tmp/skus.json
          echo "LOCATION=$LOC"
          echo "CURRENT_SIZE=$CUR"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          resize=set(x.strip() for x in open('/tmp/resize.txt') if x.strip())
          skus=json.load(open('/tmp/skus.json'))
          rows=[]
          for s in skus:
              name=s.get('name','')
              if name not in resize or not name.startswith('Standard_B'):
                  continue
              caps={c.get('name'):c.get('value') for c in s.get('capabilities',[])}
              try:
                  mem=float(caps.get('MemoryGB','nan'))
              except Exception:
                  continue
              if mem <= 4.0 or name == os.environ.get('CUR',''):
                  rows.append((name,mem,caps.get('vCPUs'),caps.get('CpuArchitectureType',''),s.get('restrictions',[])))
          def price(sku, region):
              filt = "serviceName eq 'Virtual Machines' and armRegionName eq '%s' and armSkuName eq '%s' and priceType eq 'Consumption'" % (region, sku)
              url='https://prices.azure.com/api/retail/prices?$filter='+urllib.parse.quote(filt, safe="=$' ")
              with urllib.request.urlopen(url, timeout=30) as r:
                  data=json.load(r)
              vals=[]
              for it in data.get('Items',[]):
                  product=(it.get('productName') or '')
                  meter=(it.get('meterName') or '')
                  if 'Windows' in product or 'Spot' in meter or 'Low Priority' in meter:
                      continue
                  p=it.get('retailPrice')
                  if isinstance(p,(int,float)) and p>0 and it.get('unitOfMeasure')=='1 Hour':
                      vals.append((p,it.get('currencyCode'),product,meter))
              return sorted(vals)[0] if vals else None
          region=os.environ['LOC']
          current=os.environ['CUR']
          print('CANDIDATES_BEGIN')
          for name,mem,vcpus,arch,restr in sorted(rows):
              p=price(name,region)
              print(json.dumps({'name':name,'memoryGB':mem,'vCPUs':vcpus,'arch':arch,'restrictions':restr,'price':p}, separators=(',',':')))
          print('CANDIDATES_END')
          print('CURRENT_PRICE='+json.dumps(price(current,region), separators=(',',':')))
          PY
        env:
          LOC: westeurope
          CUR: Standard_B2ls_v2
