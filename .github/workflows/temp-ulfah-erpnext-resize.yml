name: Temporary Ulfah ERPNext resize inventory

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Azure - Ulfah
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_Ulfah }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_Ulfah }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_Ulfah }}

      - name: Query live resize options and B-series capabilities
        shell: bash
        run: |
          set -euo pipefail
          RG="ERPNXTVM_GROUP"
          VM="erpnxtvm"
          LOC="$(az vm show -g "$RG" -n "$VM" --query location -o tsv --only-show-errors)"
          CUR="$(az vm show -g "$RG" -n "$VM" --query hardwareProfile.vmSize -o tsv --only-show-errors)"
          echo "LOCATION=$LOC"
          echo "CURRENT_SIZE=$CUR"
          mapfile -t SIZES < <(az vm list-vm-resize-options -g "$RG" -n "$VM" --query '[].name' -o tsv --only-show-errors | grep '^Standard_B' | sort -u)
          echo "B_RESIZE_OPTIONS_BEGIN"
          printf '%s\n' "${SIZES[@]}"
          echo "B_RESIZE_OPTIONS_END"
          echo "B_DETAILS_BEGIN"
          for s in "${SIZES[@]}"; do
            row="$(az vm list-skus --location "$LOC" --resource-type virtualMachines --all --query "[?name=='$s'] | [0].{name:name,restrictions:restrictions,capabilities:capabilities}" -o json --only-show-errors)"
            NAME="$(jq -r '.[0].name // empty' <<<"$row")"
            MEM="$(jq -r '.[0].capabilities[]? | select(.name=="MemoryGB") | .value' <<<"$row" | head -1)"
            VCPU="$(jq -r '.[0].capabilities[]? | select(.name=="vCPUs") | .value' <<<"$row" | head -1)"
            CPUARCH="$(jq -r '.[0].capabilities[]? | select(.name=="CpuArchitectureType") | .value' <<<"$row" | head -1)"
            RESTR="$(jq -c '.[0].restrictions // []' <<<"$row")"
            printf '%s\t%s\t%s\t%s\t%s\n' "$NAME" "$MEM" "$VCPU" "$CPUARCH" "$RESTR"
          done
          echo "B_DETAILS_END"
