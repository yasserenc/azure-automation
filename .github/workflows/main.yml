name: Azure Connector Proof

on:
  workflow_dispatch:
  push:
    paths:
      - azure-probe.trigger

permissions:
  id-token: write
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create and verify disposable resource group
        shell: bash
        run: |
          set -euo pipefail
          RG="rg-chatgpt-proof-${GITHUB_RUN_ID}"
          az group create --name "$RG" --location westeurope --tags purpose=chatgpt-connector-proof managed-by=github-actions >/dev/null
          test "$(az group exists --name "$RG" -o tsv)" = "true"
          echo "CREATE_VERIFIED:$RG"

      - name: Delete and verify disposable resource group
        shell: bash
        run: |
          set -euo pipefail
          RG="rg-chatgpt-proof-${GITHUB_RUN_ID}"
          az group delete --name "$RG" --yes
          test "$(az group exists --name "$RG" -o tsv)" = "false"
          echo "DELETE_VERIFIED:$RG"

      - name: Emergency cleanup
        if: always()
        shell: bash
        run: |
          RG="rg-chatgpt-proof-${GITHUB_RUN_ID}"
          if [ "$(az group exists --name "$RG" -o tsv 2>/dev/null || echo false)" = "true" ]; then
            az group delete --name "$RG" --yes || true
          fi
