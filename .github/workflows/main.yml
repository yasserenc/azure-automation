name: Azure OIDC Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - azure-probe.trigger

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove Azure create/read/delete access
        run: |
          set -euo pipefail
          RG="rg-chatgpt-proof-20260829-9f3c"
          LOCATION="westeurope"
          az account show --output json
          az group create --name "$RG" --location "$LOCATION" --tags purpose=chatgpt-connector-proof managed-by=github-actions --output json
          az group show --name "$RG" --output json
          az group delete --name "$RG" --yes
          test "$(az group exists --name "$RG")" = "false"
          echo "AZURE_CREATE_READ_DELETE_PROOF=PASS"
