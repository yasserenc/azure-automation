name: RFCY isolated HMGWEB oldest snapshot restore 2026-10-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-rfcy-hmgweb-restore-20261018.yml'

permissions:
  id-token: write
  contents: read

jobs:
  restore:
    name: Restore oldest RFCY HMGWEB snapshot as isolated test VM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: rfcy-hmgweb-20261007-restore
      cancel-in-progress: false
    steps:
      - name: Check out audited restore script
        uses: actions/checkout@v4

      - name: Authenticate only RFCY via existing GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_rfcy }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_rfcy }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_rfcy }}

      - name: Restore snapshot into isolated disk and test VM with verification
        shell: bash
        env:
          RFCY_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID_rfcy }}
        run: bash scripts/rfcy-restore-hmgweb-20261007.sh

      - name: Clear Azure session
        if: always()
        shell: bash
        run: az account clear >/dev/null 2>&1 || true
