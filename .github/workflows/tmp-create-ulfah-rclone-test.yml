name: Create Ulfah rclone test VM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-create-ulfah-rclone-test.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Azure login - Ulfah
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_Ulfah }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_Ulfah }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_Ulfah }}

      - name: Create and verify VM
        shell: bash
        run: |
          set -Eeuo pipefail

          LOCATION="westeurope"
          ZONE="1"
          SIZE="Standard_B1ls"
          RG="RCLONE-TEST_GROUP"
          VM="rclone-test"
          NIC="rclone-test-nic"
          SOURCE_RG="STG-SRV_GROUP"
          SOURCE_VM="stg-srv"

          SRC_NIC_ID="$(az vm show -g "$SOURCE_RG" -n "$SOURCE_VM"             --query "networkProfile.networkInterfaces[0].id" -o tsv)"
          SUBNET_ID="$(az network nic show --ids "$SRC_NIC_ID"             --query "ipConfigurations[0].subnet.id" -o tsv)"
          test -n "$SUBNET_ID"
          echo "Reusing subnet: $SUBNET_ID"

          az group create -n "$RG" -l "$LOCATION" -o none

          if ! az network nic show -g "$RG" -n "$NIC" >/dev/null 2>&1; then
            az network nic create               -g "$RG"               -n "$NIC"               -l "$LOCATION"               --subnet "$SUBNET_ID"               --accelerated-networking false               -o none
          fi

          if ! az vm show -g "$RG" -n "$VM" >/dev/null 2>&1; then
            az vm create               -g "$RG"               -n "$VM"               -l "$LOCATION"               --zone "$ZONE"               --size "$SIZE"               --image "Canonical:ubuntu-24_04-lts:server:latest"               --admin-username usr               --generate-ssh-keys               --nics "$NIC"               --ephemeral-os-disk true               --ephemeral-os-disk-placement CacheDisk               --os-disk-caching ReadOnly               --storage-sku Standard_LRS               --security-type Standard               -o none
          fi

          echo "=== VM ==="
          VM_JSON="$(az vm show -g "$RG" -n "$VM" -d             --query "{name:name,location:location,zones:zones,size:hardwareProfile.vmSize,privateIp:privateIps,publicIp:publicIps,provisioningState:provisioningState,diffOption:storageProfile.osDisk.diffDiskSettings.option,diffPlacement:storageProfile.osDisk.diffDiskSettings.placement,managedDiskId:storageProfile.osDisk.managedDisk.id,diskSku:storageProfile.osDisk.managedDisk.storageAccountType,caching:storageProfile.osDisk.caching}"             -o json)"
          echo "$VM_JSON"

          [[ "$(jq -r '.size' <<<"$VM_JSON")" == "$SIZE" ]]
          [[ "$(jq -r '.diffOption' <<<"$VM_JSON")" == "Local" ]]
          [[ "$(jq -r '.diffPlacement' <<<"$VM_JSON")" == "CacheDisk" ]]
          [[ "$(jq -r '.publicIp // ""' <<<"$VM_JSON")" == "" ]]

          POWER="$(az vm get-instance-view -g "$RG" -n "$VM"             --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv)"
          echo "Power state: $POWER"
          [[ "$POWER" == "VM running" ]]

          PIP_COUNT="$(az network public-ip list -g "$RG" --query "length(@)" -o tsv)"
          echo "Public IP resources in $RG: $PIP_COUNT"
          [[ "$PIP_COUNT" == "0" ]]

          DISK_COUNT="$(az disk list -g "$RG" --query "length(@)" -o tsv)"
          echo "Managed disk resources in $RG: $DISK_COUNT"
          [[ "$DISK_COUNT" == "0" ]]

          echo "SUCCESS: rclone-test Standard_B1ls ephemeral OS VM created and verified."
