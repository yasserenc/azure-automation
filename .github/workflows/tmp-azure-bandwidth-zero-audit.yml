name: Temporary Azure bandwidth zero-cost deep audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-azure-bandwidth-zero-audit.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Initialize
        shell: bash
        run: |
          set -euo pipefail
          echo "RESULTS_FILE=$RUNNER_TEMP/bw-zero-audit.jsonl" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/bw-zero-audit.jsonl"
          cat > "$RUNNER_TEMP/query.py" <<'PY'
          import json, os, subprocess, sys, datetime, time
          target=os.environ["TARGET"]; sub=os.environ["SUBSCRIPTION_ID"]
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          body={
            "type":"Usage","timeframe":"Custom",
            "timePeriod":{"from":"2026-01-01T00:00:00Z","to":now},
            "dataset":{
              "granularity":"None",
              "aggregation":{
                "totalCost":{"name":"PreTaxCost","function":"Sum"},
                "totalUsage":{"name":"UsageQuantity","function":"Sum"}
              },
              "filter":{"dimensions":{"name":"MeterCategory","operator":"In","values":["Bandwidth"]}},
              "grouping":[
                {"type":"Dimension","name":"BillingMonth"},
                {"type":"Dimension","name":"Meter"},
                {"type":"Dimension","name":"UnitOfMeasure"},
                {"type":"Dimension","name":"ServiceName"},
                {"type":"Dimension","name":"Product"},
                {"type":"Dimension","name":"PricingModel"},
                {"type":"Dimension","name":"ChargeType"},
                {"type":"Dimension","name":"BenefitName"}
              ]
            }
          }
          url=f"https://management.azure.com/subscriptions/{sub}/providers/Microsoft.CostManagement/query?api-version=2026-06-01"
          cmd=["az","rest","--method","post","--url",url,"--headers","Content-Type=application/json","--body",json.dumps(body),"-o","json"]
          data=None; err=""
          for attempt,delay in enumerate([0,5,10,20,30,45],1):
            if delay: time.sleep(delay)
            try:
              raw=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT); data=json.loads(raw); break
            except subprocess.CalledProcessError as e:
              err=e.output or ""
              if ("429" in err or "Too Many Requests" in err) and attempt<6:
                continue
              break
          if data is None:
            rec={"target":target,"status":"error","error":err[-500:] if err else "query-failed"}
          else:
            p=data.get("properties",{}); cols=[c.get("name") for c in p.get("columns",[])]; rows=[]
            for arr in p.get("rows",[]):
              d=dict(zip(cols,arr))
              rows.append(d)
            rec={"target":target,"status":"ok","period_to":now,"rows":rows}
          out=json.dumps(rec,separators=(",",":"))
          print("DEEP_AUDIT="+out)
          with open(os.environ["RESULTS_FILE"],"a") as f: f.write(out+"\n")
          PY

      - name: Login - rfcy
        id: l1
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_rfcy }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_rfcy }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_rfcy }}
      - name: Audit - rfcy
        if: always()
        continue-on-error: true
        shell: bash
        env: {TARGET: rfcy, SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID_rfcy }}", LOGIN: "${{ steps.l1.outcome }}"}
        run: |
          if [[ "$LOGIN" == success ]]; then python3 "$RUNNER_TEMP/query.py"; else echo '{"target":"rfcy","status":"login-error"}' >> "$RESULTS_FILE"; fi
          az account clear >/dev/null 2>&1 || true

      - name: Login - wdt
        id: l2
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_wdt }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_wdt }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_wdt }}
      - name: Audit - wdt
        if: always()
        continue-on-error: true
        shell: bash
        env: {TARGET: wdt, SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID_wdt }}", LOGIN: "${{ steps.l2.outcome }}"}
        run: |
          if [[ "$LOGIN" == success ]]; then python3 "$RUNNER_TEMP/query.py"; else echo '{"target":"wdt","status":"login-error"}' >> "$RESULTS_FILE"; fi
          az account clear >/dev/null 2>&1 || true

      - name: Login - altaaf
        id: l3
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_altaaf }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_altaaf }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_altaaf }}
      - name: Audit - altaaf
        if: always()
        continue-on-error: true
        shell: bash
        env: {TARGET: altaaf, SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID_altaaf }}", LOGIN: "${{ steps.l3.outcome }}"}
        run: |
          if [[ "$LOGIN" == success ]]; then python3 "$RUNNER_TEMP/query.py"; else echo '{"target":"altaaf","status":"login-error"}' >> "$RESULTS_FILE"; fi
          az account clear >/dev/null 2>&1 || true

      - name: Login - oamal
        id: l4
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_oamal }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_oamal }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_oamal }}
      - name: Audit - oamal
        if: always()
        continue-on-error: true
        shell: bash
        env: {TARGET: oamal, SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID_oamal }}", LOGIN: "${{ steps.l4.outcome }}"}
        run: |
          if [[ "$LOGIN" == success ]]; then python3 "$RUNNER_TEMP/query.py"; else echo '{"target":"oamal","status":"login-error"}' >> "$RESULTS_FILE"; fi
          az account clear >/dev/null 2>&1 || true

      - name: Login - ALBAN
        id: l5
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ALBAN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_ALBAN }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_ALBAN }}
      - name: Audit - ALBAN
        if: always()
        continue-on-error: true
        shell: bash
        env: {TARGET: ALBAN, SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID_ALBAN }}", LOGIN: "${{ steps.l5.outcome }}"}
        run: |
          if [[ "$LOGIN" == success ]]; then python3 "$RUNNER_TEMP/query.py"; else echo '{"target":"ALBAN","status":"login-error"}' >> "$RESULTS_FILE"; fi
          az account clear >/dev/null 2>&1 || true

      - name: Login - Ulfah
        id: l6
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_Ulfah }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_Ulfah }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_Ulfah }}
      - name: Audit - Ulfah
        if: always()
        continue-on-error: true
        shell: bash
        env: {TARGET: Ulfah, SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID_Ulfah }}", LOGIN: "${{ steps.l6.outcome }}"}
        run: |
          if [[ "$LOGIN" == success ]]; then python3 "$RUNNER_TEMP/query.py"; else echo '{"target":"Ulfah","status":"login-error"}' >> "$RESULTS_FILE"; fi
          az account clear >/dev/null 2>&1 || true

      - name: Final
        if: always()
        shell: bash
        run: |
          echo "DEEP_AUDIT_BEGIN"
          cat "$RESULTS_FILE"
          echo "DEEP_AUDIT_END"
