name: Grant accounts discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/grant-accounts-discovery.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    name: Discover grant-capable Azure accounts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Initialize discovery
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/grant-results.tsv"
          printf 'target\tlogin\tbilling\tgrant\tnote\n' >> "$RUNNER_TEMP/grant-results.tsv"

      - name: Login - rfcy
        id: login_rfcy
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_rfcy }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_rfcy }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_rfcy }}

      - name: Probe - rfcy
        if: always()
        shell: bash
        env:
          TARGET: rfcy
          LOGIN_OUTCOME: ${{ steps.login_rfcy.outcome }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_rfcy }}
        run: |
          set -euo pipefail
          if [[ "$LOGIN_OUTCOME" != "success" ]]; then
            printf '%s\tfail\tn/a\tno\toidc-login-failed\n' "$TARGET" >> "$RUNNER_TEMP/grant-results.tsv"
          else
            billing_property="$(az rest --method get --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/providers/Microsoft.Billing/billingProperty/default?api-version=2024-04-01" --only-show-errors 2>/dev/null || true)"
            sku="$(jq -r '.properties.skuDescription // empty' <<<"$billing_property" 2>/dev/null || true)"
            agreement="$(jq -r '.properties.billingAccountAgreementType // empty' <<<"$billing_property" 2>/dev/null || true)"
            account_id="$(jq -r '.properties.billingAccountId // empty' <<<"$billing_property" 2>/dev/null || true)"
            profile_id="$(jq -r '.properties.billingProfileId // empty' <<<"$billing_property" 2>/dev/null || true)"
            if [[ "$sku" != "Microsoft Azure Plan" || "$agreement" != "MicrosoftCustomerAgreement" || -z "$account_id" || -z "$profile_id" ]]; then
              printf '%s\tpass\tfail\tno\tnot-supported-mca-credit-model\n' "$TARGET" >> "$RUNNER_TEMP/grant-results.tsv"
            else
              ba="${account_id##*/billingAccounts/}"
              bp="${profile_id##*/billingProfiles/}"
              if az rest --method get --url "https://management.azure.com/providers/Microsoft.Billing/billingAccounts/$ba/billingProfiles/$bp/providers/Microsoft.Consumption/credits/balanceSummary?api-version=2026-06-01" --only-show-errors >/dev/null 2>&1; then
                printf '%s\tpass\tpass\tyes\tcredit-api-readable\n' "$TARGET" >> "$RUNNER_TEMP/grant-results.tsv"
              else
                printf '%s\tpass\tfail\tunknown\tbilling-credit-read-denied\n' "$TARGET" >> "$RUNNER_TEMP/grant-results.tsv"
              fi
            fi
          fi
          az account clear >/dev/null 2>&1 || true

      - name: Login - wdt
