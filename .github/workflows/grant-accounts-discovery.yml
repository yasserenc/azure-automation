      - name: Summarize discovery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Grant account discovery"
            echo ""
            echo "| Target | OIDC | Billing | Grant-capable | Note |"
            echo "|---|---|---|---|---|"
            tail -n +2 "$RUNNER_TEMP/grant-results.tsv" | while IFS=$'\t' read -r target login billing grant note; do
              echo "| $target | $login | $billing | $grant | $note |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Discovery results:"
          cat "$RUNNER_TEMP/grant-results.tsv"
