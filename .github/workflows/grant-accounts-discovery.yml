          fi
          az account clear >/dev/null 2>&1 || true

      - name: Login - alban
        id: login_alban
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_alban }}
