name: Create Ulfah testvmya IPv6-only-public VM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-create-ulfah-testvmya-ipv6.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Azure login - Ulfah
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_Ulfah }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_Ulfah }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_Ulfah }}

      - name: Create and verify testvmya
        shell: bash
        run: |
          set -Eeuo pipefail

          LOCATION="westeurope"
          ZONE="1"
          SIZE="Standard_B1ls"
          RG="TESTVMYA_GROUP"
          VM="testvmya"
          VNET="testvmya-vnet"
          SUBNET="testvmya-subnet"
          NSG="testvmya-nsg"
          NIC="testvmya-nic"
          PIP6="testvmya-ipv6"
          IPCONFIG6="ipconfig6"
          DNS_LABEL="testvmya"

          IPV4_VNET="10.250.0.0/16"
          IPV4_SUBNET="10.250.0.0/24"
          IPV6_VNET="fd42:7465:7374::/48"
          IPV6_SUBNET="fd42:7465:7374:1::/64"

          az group create -n "$RG" -l "$LOCATION" -o none

          if ! az network vnet show -g "$RG" -n "$VNET" >/dev/null 2>&1; then
            az network vnet create \
              -g "$RG" \
              -n "$VNET" \
              -l "$LOCATION" \
              --address-prefixes "$IPV4_VNET" "$IPV6_VNET" \
              --subnet-name "$SUBNET" \
              --subnet-prefixes "$IPV4_SUBNET" "$IPV6_SUBNET" \
              -o none
          fi

          if ! az network nsg show -g "$RG" -n "$NSG" >/dev/null 2>&1; then
            az network nsg create -g "$RG" -n "$NSG" -l "$LOCATION" -o none
          fi

          if ! az network nsg rule show -g "$RG" --nsg-name "$NSG" -n Allow-SSH >/dev/null 2>&1; then
            az network nsg rule create \
              -g "$RG" \
              --nsg-name "$NSG" \
              -n Allow-SSH \
              --priority 100 \
              --direction Inbound \
              --access Allow \
              --protocol Tcp \
              --source-address-prefixes Internet \
              --source-port-ranges '*' \
              --destination-address-prefixes '*' \
              --destination-port-ranges 22 \
              -o none
          fi

          if ! az network public-ip show -g "$RG" -n "$PIP6" >/dev/null 2>&1; then
            az network public-ip create \
              -g "$RG" \
              -n "$PIP6" \
              -l "$LOCATION" \
              --sku Standard \
              --tier Regional \
              --version IPv6 \
              --allocation-method Static \
              --zone "$ZONE" \
              --dns-name "$DNS_LABEL" \
              -o none
          fi

          if ! az network nic show -g "$RG" -n "$NIC" >/dev/null 2>&1; then
            az network nic create \
              -g "$RG" \
              -n "$NIC" \
              -l "$LOCATION" \
              --vnet-name "$VNET" \
              --subnet "$SUBNET" \
              --network-security-group "$NSG" \
              --accelerated-networking false \
              -o none
          fi

          if ! az network nic ip-config show -g "$RG" --nic-name "$NIC" -n "$IPCONFIG6" >/dev/null 2>&1; then
            az network nic ip-config create \
              -g "$RG" \
              --nic-name "$NIC" \
              -n "$IPCONFIG6" \
              --private-ip-address-version IPv6 \
              --vnet-name "$VNET" \
              --subnet "$SUBNET" \
              --public-ip-address "$PIP6" \
              -o none
          fi

          if ! az vm show -g "$RG" -n "$VM" >/dev/null 2>&1; then
            az vm create \
              -g "$RG" \
              -n "$VM" \
              -l "$LOCATION" \
              --zone "$ZONE" \
              --size "$SIZE" \
              --image "Canonical:ubuntu-24_04-lts:server:latest" \
              --admin-username usr \
              --generate-ssh-keys \
              --nics "$NIC" \
              --ephemeral-os-disk true \
              --ephemeral-os-disk-placement CacheDisk \
              --os-disk-caching ReadOnly \
              --storage-sku Standard_LRS \
              --security-type Standard \
              -o none
          fi

          # Add the repository owner's public GitHub SSH keys so the VM is not
          # dependent on the temporary key generated on the GitHub runner.
          PUBKEYS="$(curl -fsSL https://github.com/yasserenc.keys | grep -E '^ssh-' || true)"
          if [[ -n "$PUBKEYS" ]]; then
            KEYS_B64="$(printf '%s\n' "$PUBKEYS" | base64 -w0)"
            az vm run-command invoke \
              -g "$RG" \
              -n "$VM" \
              --command-id RunShellScript \
              --scripts "set -e; install -d -m 700 -o usr -g usr /home/usr/.ssh; printf '%s' '$KEYS_B64' | base64 -d >> /home/usr/.ssh/authorized_keys; awk '!seen[\$0]++' /home/usr/.ssh/authorized_keys > /tmp/authorized_keys; install -m 600 -o usr -g usr /tmp/authorized_keys /home/usr/.ssh/authorized_keys" \
              -o none
          fi

          VM_JSON="$(az vm show -g "$RG" -n "$VM" \
            --query "{name:name,location:location,zones:zones,size:hardwareProfile.vmSize,provisioningState:provisioningState,diffOption:storageProfile.osDisk.diffDiskSettings.option,diffPlacement:storageProfile.osDisk.diffDiskSettings.placement,caching:storageProfile.osDisk.caching}" \
            -o json)"

          PIP_JSON="$(az network public-ip show -g "$RG" -n "$PIP6" \
            --query "{name:name,ip:ipAddress,fqdn:dnsSettings.fqdn,version:publicIPAddressVersion,sku:sku.name,tier:sku.tier,allocation:publicIPAllocationMethod,zones:zones}" \
            -o json)"

          NIC_JSON="$(az network nic show -g "$RG" -n "$NIC" \
            --query "ipConfigurations[].{name:name,primary:primary,privateVersion:privateIPAddressVersion,privateIp:privateIPAddress,publicIpId:publicIPAddress.id}" \
            -o json)"

          POWER="$(az vm get-instance-view -g "$RG" -n "$VM" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv)"

          IPV4_PIP_COUNT="$(az network public-ip list -g "$RG" --query "length([?publicIPAddressVersion=='IPv4'])" -o tsv)"
          IPV6_PIP_COUNT="$(az network public-ip list -g "$RG" --query "length([?publicIPAddressVersion=='IPv6'])" -o tsv)"
          DISK_COUNT="$(az disk list -g "$RG" --query "length(@)" -o tsv)"

          echo "=== VM ==="
          echo "$VM_JSON"
          echo "=== PUBLIC IPv6 ==="
          echo "$PIP_JSON"
          echo "=== NIC IP CONFIGURATIONS ==="
          echo "$NIC_JSON"
          echo "Power state: $POWER"
          echo "IPv4 public IP resources: $IPV4_PIP_COUNT"
          echo "IPv6 public IP resources: $IPV6_PIP_COUNT"
          echo "Managed disk resources: $DISK_COUNT"

          [[ "$(jq -r '.size' <<<"$VM_JSON")" == "$SIZE" ]]
          [[ "$(jq -r '.diffOption' <<<"$VM_JSON")" == "Local" ]]
          [[ "$(jq -r '.diffPlacement' <<<"$VM_JSON")" == "CacheDisk" ]]
          [[ "$(jq -r '.version' <<<"$PIP_JSON")" == "IPv6" ]]
          [[ "$(jq -r '.sku' <<<"$PIP_JSON")" == "Standard" ]]
          [[ -n "$(jq -r '.ip // empty' <<<"$PIP_JSON")" ]]
          [[ -n "$(jq -r '.fqdn // empty' <<<"$PIP_JSON")" ]]
          [[ "$POWER" == "VM running" ]]
          [[ "$IPV4_PIP_COUNT" == "0" ]]
          [[ "$IPV6_PIP_COUNT" == "1" ]]
          [[ "$DISK_COUNT" == "0" ]]

          IPV6="$(jq -r '.ip' <<<"$PIP_JSON")"
          FQDN="$(jq -r '.fqdn' <<<"$PIP_JSON")"

          echo "SUCCESS: $VM is running with Standard_B1ls + ephemeral CacheDisk and only a public IPv6."
          echo "IPv6: $IPV6"
          echo "FQDN: $FQDN"

          {
            echo "## testvmya deployment"
            echo "- VM: `$VM`"
            echo "- Size: `$SIZE`"
            echo "- Region: `$LOCATION`"
            echo "- Zone: `$ZONE`"
            echo "- OS disk: ephemeral `CacheDisk`"
            echo "- Public IPv4 resources: `$IPV4_PIP_COUNT`"
            echo "- Public IPv6: `$IPV6`"
            echo "- DNS: `$FQDN`"
          } >> "$GITHUB_STEP_SUMMARY"
